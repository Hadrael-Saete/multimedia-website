<!doctype html>
<html>
    <head>
        <title>Play and Control Sound (Web Audio API)</title>
        <link rel="stylesheet" href="song-player.css" />
    </head>
    <body>
        <label for="audioSelect">Choose a music:</label>
        <select id="audioSelect" disabled>
            <option>Loading available files...</option>
        </select>
        <p id="loadingStatus">Connecting to the audio server...</p>
        <button id="playButton" disabled>Play Sound</button>
        <label for="distanceControl">Distance from listener:</label>
        <input type="range" id="distanceControl" min="1" max="20" step="0.1" value="5" />
        <label for="angleControl">Angle around listener:</label>
        <input type="range" id="angleControl" min="-90" max="90" step="1" value="0" />
        <section id="meters" aria-label="Track volume meters"></section>

        <script>
            const API_BASE_URL =
                "https://ns-csuire01-rockband-static.labs.iut-larochelle.fr";
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const audioSelect = document.getElementById("audioSelect");
            const playButton = document.getElementById("playButton");
            const loadingStatus = document.getElementById("loadingStatus");
            const distanceControl = document.getElementById("distanceControl");
            const angleControl = document.getElementById("angleControl");
            const pannerNode = audioContext.createPanner();
            const stereoPannerNode = audioContext.createStereoPanner();

            pannerNode.panningModel = "HRTF";
            pannerNode.distanceModel = "inverse";
            pannerNode.refDistance = 1;
            pannerNode.maxDistance = 20;
            pannerNode.rolloffFactor = 1;
            pannerNode.connect(stereoPannerNode).connect(audioContext.destination);

            let accessToken;
            let audioFiles = [];
            let audioBuffers = [];
            let activeSources = [];
            let analysers = [];

            function createMeters(trackFiles) {
                const meters = document.getElementById("meters");
                meters.replaceChildren(
                    ...trackFiles.map((file, index) => {
                        const container = document.createElement("div");
                        const label = document.createElement("span");
                        const canvas = document.createElement("canvas");

                        container.className = "meter";
                        label.textContent = file.filename;
                        canvas.width = 320;
                        canvas.height = 64;
                        canvas.dataset.trackIndex = index;
                        container.append(label, canvas);
                        return container;
                    }),
                );
            }

            function drawMeters() {
                analysers.forEach(({ analyser, canvas }) => {
                    const context = canvas.getContext("2d");
                    const frequencies = new Uint8Array(analyser.frequencyBinCount);
                    analyser.getByteFrequencyData(frequencies);

                    const average = frequencies.reduce(
                        (total, frequency) => total + frequency,
                        0,
                    ) / frequencies.length;
                    const level = Math.min(1, average / 180);
                    const width = canvas.width * level;
                    const gradient = context.createLinearGradient(0, 0, canvas.width, 0);

                    gradient.addColorStop(0, "#22c55e");
                    gradient.addColorStop(0.65, "#eab308");
                    gradient.addColorStop(0.85, "#f97316");
                    gradient.addColorStop(1, "#dc2626");

                    context.clearRect(0, 0, canvas.width, canvas.height);
                    context.fillStyle = "#e5e7eb";
                    context.fillRect(0, 0, canvas.width, canvas.height);
                    context.fillStyle = gradient;
                    context.fillRect(0, 0, Math.max(width, level > 0 ? 2 : 0), canvas.height);

                    context.strokeStyle = "rgba(255, 255, 255, 0.7)";
                    context.lineWidth = 1;
                    for (let marker = 1; marker < 10; marker += 1) {
                        const x = (canvas.width * marker) / 10;
                        context.beginPath();
                        context.moveTo(x, 0);
                        context.lineTo(x, canvas.height);
                        context.stroke();
                    }
                });

                window.requestAnimationFrame(drawMeters);
            }

            function updateSourcePosition() {
                const distance = Number(distanceControl.value);
                const angle = (Number(angleControl.value) * Math.PI) / 180;
                const x = Math.sin(angle) * distance;
                const z = -Math.cos(angle) * distance;
                const stereoPan = Math.max(-1, Math.min(1, Math.sin(angle)));

                if (pannerNode.positionX) {
                    pannerNode.positionX.value = x;
                    pannerNode.positionY.value = 0;
                    pannerNode.positionZ.value = z;
                } else {
                    pannerNode.setPosition(x, 0, z);
                }
                stereoPannerNode.pan.value = stereoPan;
            }

            playButton.addEventListener("click", async () => {
                if (audioBuffers.length === 0) {
                    return;
                }

                await audioContext.resume();

                activeSources.forEach((source) => source.stop());
                activeSources = audioBuffers.map((buffer, index) => {
                    const source = audioContext.createBufferSource();
                    const analyser = audioContext.createAnalyser();

                    source.buffer = buffer;
                    analyser.fftSize = 256;
                    analyser.smoothingTimeConstant = 0.8;
                    source.connect(analyser).connect(pannerNode);
                    source.start();
                    analysers[index] = {
                        analyser,
                        canvas: document.querySelector(
                            `canvas[data-track-index="${index}"]`,
                        ),
                    };
                    return source;
                });
            });

            distanceControl.addEventListener("input", updateSourcePosition);
            angleControl.addEventListener("input", updateSourcePosition);
            updateSourcePosition();

            async function getAccessToken() {
                const response = await fetch(`${API_BASE_URL}/api/token`);
                if (!response.ok) {
                    throw new Error(`Token request failed: ${response.status}`);
                }

                const data = await response.json();
                if (!data.success || !data.token) {
                    throw new Error("The audio server returned an invalid token.");
                }

                return data.token;
            }

            async function loadAudioFiles() {
                const response = await fetch(
                    `${API_BASE_URL}/api/files?token=${encodeURIComponent(accessToken)}`,
                );
                if (!response.ok) {
                    throw new Error(`File list request failed: ${response.status}`);
                }

                const data = await response.json();
                if (!data.success || !Array.isArray(data.files)) {
                    throw new Error("The audio server returned an invalid file list.");
                }

                audioFiles = data.files.filter((file) => file.category === "audio");

                if (audioFiles.length === 0) {
                    throw new Error("No audio files are available on the server.");
                }

                const artists = [...new Set(audioFiles.map((file) => file.artist))];
                audioSelect.replaceChildren(
                    ...artists.map((artist) => {
                        const option = document.createElement("option");
                        option.value = artist;
                        option.textContent = artist;
                        return option;
                    }),
                );
                audioSelect.disabled = false;
            }

            async function loadSelectedAudio() {
                const selectedArtist = audioSelect.value;
                const selectedFiles = audioFiles.filter(
                    (file) => file.artist === selectedArtist,
                );
                loadingStatus.textContent = "Loading all music tracks...";
                playButton.disabled = true;
                audioBuffers = [];

                try {
                    audioBuffers = await Promise.all(
                        selectedFiles.map(async (file) => {
                            const response = await fetch(
                                `${API_BASE_URL}/assets/${file.path}?token=${encodeURIComponent(accessToken)}`,
                            );
                            if (!response.ok) {
                                throw new Error(
                                    `Audio request failed for ${file.filename}: ${response.status}`,
                                );
                            }

                            const arrayBuffer = await response.arrayBuffer();
                            return audioContext.decodeAudioData(arrayBuffer);
                        }),
                    );

                    createMeters(selectedFiles);
                    analysers = [];
                    playButton.disabled = false;
                    loadingStatus.textContent = `${audioBuffers.length} tracks ready.`;
                } catch (error) {
                    audioBuffers = [];
                    loadingStatus.textContent = "Unable to load all music tracks.";
                    console.error("Unable to load audio from the server.", error);
                }
            }

            audioSelect.addEventListener("change", loadSelectedAudio);

            async function initializeAudioLibrary() {
                try {
                    accessToken = await getAccessToken();
                    await loadAudioFiles();
                    await loadSelectedAudio();
                } catch (error) {
                    loadingStatus.textContent = "Unable to connect to the audio server.";
                    console.error("Unable to initialize the audio library.", error);
                }
            }

            drawMeters();
            initializeAudioLibrary();
        </script>
    </body>
</html>
